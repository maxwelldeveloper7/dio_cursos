<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/only-of-type.css">
    <title>Pseudo-classes</title>
</head>
<body>
    <h1>Pseudo-classes:</h1>
    <div>
        <input type="checkbox" name="only-of-type">
        <label for="only-of-type">:only-of-type</label>
    </div>
    
    <hr>

    <main>
        <div>Eeu sou a div #1.</div>
        <p>Eu sou o único p entre irmãos</p>
        <div>Eu sou a div #2.</div>
        <div>
            Eu sou a div #3.
            <i>Eu sou o único filho i</i>
            <em>Eu sou o em #1.</em>
            <em>Eu sou o em #2.</em>
        </div>
    </main>
    
</body>
</html>
