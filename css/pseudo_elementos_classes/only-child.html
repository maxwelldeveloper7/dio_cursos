<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/only-child.css">
    <title>Pseudo-classes</title>
</head>
<body>
    <h1>Pseudo-classes:</h1>
    <div>
        <input type="checkbox" name="only-child">
        <label for="only-child">:only-child</label>
    </div>
    
    <p>Único item em uma lista</p>
    <ul>
        <li>Item 01</li>
    </ul>

    <p>Vários itens em uma lista</p>
    <ul>
        <li>Item 01</li>
        <li>Item 02</li>
        <li>Item 03</li>
        <li>Item 04</li>
    </ul>
    
</body>
</html>
