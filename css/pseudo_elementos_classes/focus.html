<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/focus.css">
    <title>Pseudo-classes</title>
</head>

<body>
    <h1>Pseudo-classes | :focus, :focus-within e :focus-visible</h1>

    <form>
        <p>Faça seu pedido! Escolha o sabor do sorverte que você deseja</p>
        <label>
            Nome Completo:
            <input type="text" name="nome">
        </label>
        <label>
            Sabor do sorverte:
            <select name="sabor" id="">
                <option value="chocolate">Chocolate</option>
                <option value="morango">Morango</option>
                <option value="doce-leite">Doce de Leite</option>
                <option value="abacaxi">Abacaxi</option>
            </select>
        </label>
        <button>Finalizar Pedido</button>
    </form>
</body>

</html>
