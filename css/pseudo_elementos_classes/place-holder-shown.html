<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/place-holder-shown.css">
    <title>Pseudo-classes</title>
</head>
<body>
    <h1>Pseudo-classes | :place-holder-shown</h1>
    <form>
        <label for="name">Nome completo:</label>
        <input name="name" type="text"><br><br>
        <label for="email">E-mail:</label>
        <input type="email" name="email" placeholder="name@example.com"><br><br>
        <label for="age">Sua idade:</label>
        <input type="number" name="age" value="18" placeholder="Você deve ter 18+ anos">
    </form>
</body>
</html>
