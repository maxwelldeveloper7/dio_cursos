<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/autofill.css">
    <title>Pseudo-classes</title>
</head>
<body>
    <h1>Pseudo-classes</h1>
    <div>
        <input name="autofill" type="checkbox">
        <label for="autofill">:autofill</label>
    </div>
    <div>
        <input name="-webkit-autofill" type="checkbox">
        <label for="-webkit-autofill">:-webkit-autofill</label>
    </div>
    
    <hr>
    <form>
        <h3>Faça sua compra:</h3>
        <label for="email" required>Email:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="senha">Senha:</label>
        <input type="password" required>

        <button type="submit">Entrar</button>

    </form>
</body>
</html>
